name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
        dependencies: [highest]
        include:
          - php: '8.2'
            symfony: '6.4.*'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin Symfony version
        run: |
          composer config minimum-stability stable
          composer require --no-update \
            "symfony/notifier:${{ matrix.symfony }}" \
            "symfony/http-client:${{ matrix.symfony }}" \
            "symfony/cache:${{ matrix.symfony }}"

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --prefer-stable --no-interaction --no-progress
          fi

      - name: Show installed Symfony versions
        run: composer show 'symfony/*' | grep -E '^symfony/(notifier|http-client|cache) '

      # Symfony 6.4's TransportFactoryTestCase uses @dataProvider annotations,
      # which PHPUnit 11 reports as (non-blocking) deprecations.
      - name: Run tests
        run: vendor/bin/phpunit --exclude-group integration --do-not-fail-on-phpunit-deprecation
